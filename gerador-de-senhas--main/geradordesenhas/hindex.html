<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Gerador de Senhas</title>
</head>
<body>
<section class="conteudo">
    <div class="conteudo-title">
        <img src="" alt="imagem de cadeado">
        <h2 class="titulo-principal">Gerador de Senhas</h2>
        <h3 class="titulo-secundario">Gere senhas aleatorias e seguras para minha mamae</h3>
    </div>

    <div class="conteudo-senha">
        <label for="Senha">Senha</label>
        <input name="Senha" type="text" id="campo-senha">
    </div>
    <div class="parametro">
        <h3 class="parametro-title">Personalize a senha de sua mamae</h3>
        <div class="parametro-coluna__senha">
            <div class="parametro-senha">
                <h4 class="parametro-senha__title">Numero de Caracteres</h4>
                <div class="parametro-senha-botoes">
                    <button class="parametro-senha__botao">-</button>
                    <p class="parametro-senha__text">12</p>
                    <button class="parametro-senha__botao">+</button>

                </div>
            </div>
            <div class="parametro-senha">
                <h4 class="parametro-senha__title">Caracteristica da Senha</h4>
                <div class="parametro-senha__checkbox" class="checkbox">
                    <input name="maiusculo" type="checkbox">
                    <label for="maiusculo">Letras Maiusculas</label>
                </div>
                <div class="parametro-senha-checkox">
                    <input name="minuculo" type="checkbox" class="checkbox" checked>
                    <label for="minusculo">Letras Minusculas</label>
                </div>
                <div class="parametro-senha-checkox">
                    <input name="numero" type="checkbox" class="checkbox" checked>
                    <label for="numero">Numeros</label>
            </div>
            <div class="parametro-senha-checkox">
                <input name="simbolo" type="checkbox" class="checkbox" checked>
                <label for="simbolo">Simbolos</label>
        </div>
    </div>
    <div class="parametro-senha"></div>
    <h4 class="parametro-senha__titulo">Força da Senha</h4>
    <div class="barra"></div>
    <div class="forca fraca"></div>
    <div class="parametro-senha-text">
    <p>Fraca</p>
<p> Média</p>
<p>Fraca</p>
</div>
<p class="entropia"></p>

</div>
</div>
</div>

</section>
<script class="main.js"></script>
</body>
</html>
