<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gerador de semhas</title>
</head>
<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="" alt="imagem de um cadeado">
            <h2 class="titulo-principal">gerador de senhas</h2>
            <h3 class="titulo-secundario">gere senhas aleatorias e seguras</h3>
        </div>
        <div class="conteudo-senha">
            <label for="senha">senha</label>
            <input name="senha" type="text" id="campo-senha">
        </div>
        <div class="parametro">
            <h3 class="parametro-titulo">personalize sua senha</h3>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">numero de caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>
                    </div>
                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">caracteristicas da senha</h4>
                    <div class="parametro-senha-checkbox">
                        <input name="maiusculo" type="checkbox" class="checkbox" cheked>
                        <label for="maiusculo">letras maiusculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="minusculo" type="checkbox" class="checkbox" cheked>
                        <label for="minusculo">lestras minusculas</label>
                    </div>
                     <div class="parametro-senha-checkbox">
                        <input name="simbolo" type="checkbox" class="checkbox" cheked>
                        <label for="numero">lestras minusculas</label>
                    </div>
                     <div class="parametro-senha-checkbox">
                        <input name="simbolo" type="checkbox" class="checkbox" cheked>
                        <label for="simbolo">simbolos</label>
                    </div>
                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">força da senha</h4>
                    <div class="barra"></div>
                    <div class="forca fraca"></div>
                    <div class="parametro-senha-texto"></div>
                    <p>fraca</p>
                    <p>media</p>
                    <p>forte</p>
                </div>
                <p class="entropia"></p>
            </div>
        </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
